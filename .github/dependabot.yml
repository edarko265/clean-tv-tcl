version: 2
updates:
  - package-ecosystem: gradle
    directory: /launcher
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    open-pull-requests-limit: 5
