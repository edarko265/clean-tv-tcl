name: Bug
description: The launcher, a script or the prompt did something wrong
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - Launcher (the home screen)
        - Install script (build-and-install)
        - Debloat or restore scripts
        - tools/tv.py or b64push.py
        - The prompt (PROMPT.md)
        - Theme or visual asset
        - Documentation
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV model and Android version
      placeholder: Xiaomi MiTV-MOOQ1, Android TV 10
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Down twice from the dock
        2. Press Home
  - type: textarea
    id: logs
    attributes:
      label: Output or screenshot
      description: Remove IP addresses, Wi-Fi names, serial numbers, account data, device IDs, and ADB keys before posting.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety check
      options:
        - label: I removed private device and household information from this report.
          required: true
        - label: This is not a security vulnerability; security reports use the private process in SECURITY.md.
          required: true
